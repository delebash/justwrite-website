name: Deploy to GitHub Pages

# Only when asked: `npm run deploy` here (gh workflow run deploy.yml) or the Actions page's "Run
# workflow" — never on a push, a schedule or another repository's workflow (the user, 2026-10-28: "i only
# want stuff to build when i say so"; "other github workflows shouldnt be running other workflows"). The
# prebuild step (package.json) takes the latest justwrite-app release's docs.tar.gz.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
