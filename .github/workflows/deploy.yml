# SPDX-License-Identifier: MIT
# A family app's website: built with the docs of the app's latest release and published on GitHub Pages. The kit's
# (just-core/website/.github/workflows/deploy.yml) — every site copies it as it is (the family guard checks).
# Nothing builds by itself (the user, 2026-10-28: "i dont ever want an automatic build of anything i only want stuff
# to build when i say so"; "other github workflows shouldnt be running other workflows"): it starts only by hand —
# the site's `npm run deploy` (scripts/deploy.js) or the Actions page's "Run workflow". From justwrite-website's
# deploy.yml (MIT — the kit's NOTICE.md), without its push and repository_dispatch triggers.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Deploy the built site to GitHub Pages (off: a dry run — the site is built and uploaded, never deployed)."
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24 # the family's Node (Electron 44 carries 24.22.1) — it moves with the Electron major
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild: scripts/sync-docs.js --from release — the docs of the app's latest release
      - name: Build site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
